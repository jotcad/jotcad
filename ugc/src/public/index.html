<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JotCAD Session Timeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0c0d10;
      --panel-bg: rgba(18, 20, 24, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-color: #f1f3f9;
      --text-muted: #8e96aa;
      --primary: #8a2be2;
      --secondary: #00f0ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(12, 13, 16, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      height: 60px;
    }

    header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.3rem;
      background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .session-badge {
      background: rgba(0, 240, 255, 0.06);
      border: 1px solid rgba(0, 240, 255, 0.2);
      color: var(--secondary);
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-family: monospace;
    }

    /* Screen Views Container */
    .view-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-in-out;
      display: flex;
      flex-direction: column;
    }

    .view.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* VIEW 1: Lean Timeline View */
    #list-view {
      align-items: center;
      padding: 2rem;
      overflow-y: auto;
    }

    .timeline-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      font-family: 'Outfit', sans-serif;
    }

    .timeline-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: var(--secondary);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: var(--secondary);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--secondary);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .snapshot-item {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
    }

    .snapshot-item:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .snapshot-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .snapshot-item .meta-row {
      display: flex;
      gap: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .snapshot-item .seq-badge {
      font-family: monospace;
      color: var(--secondary);
      font-weight: bold;
    }

    .snapshot-item .note {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .arrow-icon {
      color: var(--text-muted);
      font-size: 1.2rem;
      transition: transform 0.2s ease;
    }

    .snapshot-item:hover .arrow-icon {
      color: var(--secondary);
      transform: translateX(3px);
    }

    /* VIEW 2: Sub-page Detail View */
    .details-workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 450px;
      overflow: hidden;
    }

    .viewport-panel {
      position: relative;
      height: 100%;
      background: #060709;
      border-right: 1px solid var(--border-color);
    }

    #canvas3d {
      width: 100%;
      height: 100%;
      outline: none;
    }

    .controls-overlay {
      position: absolute;
      top: 1.25rem;
      left: 1.25rem;
      z-index: 10;
    }

    .actions-overlay {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      display: flex;
      gap: 0.75rem;
      z-index: 10;
    }

    .btn-action {
      background: rgba(18, 20, 24, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 0.8rem;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-action.primary {
      background: rgba(0, 240, 255, 0.1);
      border-color: var(--secondary);
      color: var(--secondary);
    }

    .btn-action.primary:hover {
      background: rgba(0, 240, 255, 0.2);
    }

    /* Details Right Panel: Script & Parameters */
    .details-right-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .details-section-header {
      padding: 1.25rem;
      background: rgba(0, 0, 0, 0.15);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .details-meta-card {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .details-meta-card h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .meta-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      font-family: monospace;
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }

    .meta-detail-item {
      color: var(--text-muted);
    }

    .meta-detail-item span {
      color: var(--secondary);
    }

    .code-container {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    pre.code-display {
      flex: 1;
      overflow: auto;
      padding: 1.25rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: #9cdcfe;
      line-height: 1.5;
      margin: 0;
      background: #060709;
    }
  </style>
</head>
<body>

  <header>
    <h1>JotCAD Session Hub</h1>
    <span class="session-badge" id="session-id">Loading...</span>
  </header>

  <div class="view-container">
    
    <!-- VIEW 1: LEAN TIMELINE LIST -->
    <div id="list-view" class="view active">
      <div class="timeline-container">
        <div class="timeline-header">
          <h2>Snapshot Lineage</h2>
          <div class="live-indicator">
            <div class="pulse-dot"></div>
            <span>Auto Polling</span>
          </div>
        </div>
        <div id="snapshots-list">
          <!-- Dyn lists -->
        </div>
      </div>
    </div>

    <!-- VIEW 2: SUB-PAGE DETAIL VIEW -->
    <div id="details-view" class="view">
      <div class="details-workspace">
        
        <!-- Viewport Left -->
        <div class="viewport-panel">
          <div class="controls-overlay">
            <button class="btn-action" id="btn-back">← Back to Timeline</button>
          </div>
          <div class="actions-overlay">
            <a id="btn-png" class="btn-action" target="_blank">View PNG</a>
            <a id="btn-stl" class="btn-action primary" download>Download STL</a>
          </div>
          <div id="canvas3d"></div>
        </div>

        <!-- Details Right -->
        <div class="details-right-panel">
          
          <div class="details-meta-card">
            <h3 id="detail-note">Run Note</h3>
            <div class="meta-detail-grid">
              <div class="meta-detail-item">Sequence: <span id="detail-seq">#000</span></div>
              <div class="meta-detail-item">Timestamp: <span id="detail-time">--</span></div>
              <div class="meta-detail-item">Duration: <span id="detail-duration">0ms</span></div>
              <div class="meta-detail-item">STL Size: <span id="detail-size">0 KB</span></div>
            </div>
          </div>

          <div class="code-container">
            <div class="details-section-header">
              <span>script.jot</span>
              <span id="detail-inputs" style="font-family: monospace; color: var(--secondary);">size=22</span>
            </div>
            <pre class="code-display" id="code-block">// Loading script...</pre>
          </div>

        </div>

      </div>
    </div>

  </div>

  <!-- Three.js CDN Packages -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>

  <script>
    let activeSnapshot = null;
    let scene, camera, renderer, controls, activeMesh;
    const canvasContainer = document.getElementById('canvas3d');

    // 1. SPA Navigation Router
    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      
      if (viewId === 'details-view') {
        onWindowResize(); // Force resize three.js canvas when container appears
      }
    }

    document.getElementById('btn-back').onclick = () => {
      activeSnapshot = null;
      showView('list-view');
    };

    // 2. Initialize Three.js Viewport
    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060709);

      camera = new THREE.PerspectiveCamera(45, canvasContainer.clientWidth / canvasContainer.clientHeight, 0.1, 1000);
      camera.position.set(40, 40, 50);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      canvasContainer.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Lights
      const ambientLight = new THREE.AmbientLight(0x222222);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.85);
      dirLight1.position.set(1, 1, 1).normalize();
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0x444444, 0.5);
      dirLight2.position.set(-1, -1, -1).normalize();
      scene.add(dirLight2);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      if (!canvasContainer || !renderer) return;
      camera.aspect = canvasContainer.clientWidth / canvasContainer.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
    }

    // 3. Load STL Model into Viewport
    function loadSTL(url) {
      const loader = new THREE.STLLoader();
      loader.load(url, (geometry) => {
        if (activeMesh) {
          scene.remove(activeMesh);
          activeMesh.geometry.dispose();
          activeMesh.material.dispose();
        }

        const material = new THREE.MeshPhongMaterial({
          color: 0x8a2be2,
          specular: 0x111111,
          shininess: 200,
          flatShading: true
        });
        
        activeMesh = new THREE.Mesh(geometry, material);
        geometry.computeVertexNormals();
        geometry.center();
        
        // Adjust camera to fit
        const boundingBox = new THREE.Box3().setFromObject(activeMesh);
        const size = boundingBox.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        camera.position.set(maxDim * 1.5, maxDim * 1.5, maxDim * 1.8);
        controls.target.set(0, 0, 0);

        scene.add(activeMesh);
      }, undefined, (err) => {
        console.error('Failed to load STL model:', err);
      });
    }

    // 4. Load Session Data (Latest First)
    let prevSnapshotCount = 0;
    async function loadSession() {
      try {
        const resp = await fetch('/api/session');
        const data = await resp.json();
        
        document.getElementById('session-id').innerText = data.sessionId.split('/').pop();
        
        const snapshotsList = document.getElementById('snapshots-list');
        
        if (data.snapshots.length !== prevSnapshotCount) {
          prevSnapshotCount = data.snapshots.length;
          snapshotsList.innerHTML = '';
          
          // Sort snaps in reverse chronological order (Latest First)
          const sortedSnaps = [...data.snapshots].sort((a, b) => b.sequence.localeCompare(a.sequence));

          sortedSnaps.forEach((snap) => {
            const item = document.createElement('div');
            item.className = 'snapshot-item';
            
            const dateStr = snap.timestamp.replace(/(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/, '$1-$2-$3 $4:$5');
            const inputsText = snap.run ? Object.entries(snap.run.inputs).map(([k, v]) => `${k}=${v}`).join(', ') : '';

            item.innerHTML = `
              <div class="snapshot-info">
                <div class="meta-row">
                  <span class="seq-badge">#${snap.sequence}</span>
                  <span>${dateStr}</span>
                </div>
                <div class="note">${snap.note}</div>
              </div>
              <div class="arrow-icon">→</div>
            `;

            item.onclick = () => selectSnapshot(snap);
            snapshotsList.appendChild(item);
          });
          
          // Refresh active snapshot if details page is currently open
          if (activeSnapshot) {
            const refreshed = data.snapshots.find(s => s.sequence === activeSnapshot.sequence);
            if (refreshed) {
              selectSnapshot(refreshed, false);
            }
          }
        }
      } catch (err) {
        console.error('Error fetching session data:', err);
      }
    }

    // 5. Select and Navigate to Snapshot sub-page
    async function selectSnapshot(snap, navigate = true) {
      activeSnapshot = snap;
      
      // Update metadata card fields
      document.getElementById('detail-note').innerText = snap.note;
      document.getElementById('detail-seq').innerText = `#${snap.sequence}`;
      
      const dateStr = snap.timestamp.replace(/(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/, '$1-$2-$3 $4:$5');
      document.getElementById('detail-time').innerText = dateStr;

      if (snap.run) {
        const stlSizeKB = (snap.run.outputs?.stl_file?.size / 1024).toFixed(1);
        document.getElementById('detail-duration').innerText = `${snap.run.compileDurationMs}ms`;
        document.getElementById('detail-size').innerText = `${stlSizeKB} KB`;
        
        const inputsText = Object.entries(snap.run.inputs).map(([k, v]) => `${k}=${v}`).join(', ');
        document.getElementById('detail-inputs').innerText = inputsText;
      } else {
        document.getElementById('detail-duration').innerText = '0ms';
        document.getElementById('detail-size').innerText = '0 KB';
        document.getElementById('detail-inputs').innerText = '';
      }

      // Load Script code block
      const scriptUrl = `/api/session/snapshots/${encodeURIComponent(snap.dirName)}/script.jot`;
      try {
        const scriptResp = await fetch(scriptUrl);
        document.getElementById('code-block').innerText = await scriptResp.text();
      } catch (e) {
        document.getElementById('code-block').innerText = '// Failed to load script code';
      }

      // Load Viewport STL & setup actions
      const stlUrl = `/api/session/snapshots/${encodeURIComponent(snap.dirName)}/output.stl`;
      const pngUrl = `/api/session/snapshots/${encodeURIComponent(snap.dirName)}/preview.png`;

      loadSTL(stlUrl);
      document.getElementById('btn-stl').href = stlUrl;
      document.getElementById('btn-png').href = pngUrl;

      if (navigate) {
        showView('details-view');
      }
    }

    // Boot
    init3D();
    loadSession();
    setInterval(loadSession, 3000);
  </script>
</body>
</html>
